services:
  - type: web
    name: skaiscanner-api
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    preDeployCommand: python backend/manage.py migrate
    startCommand: cd backend && gunicorn yatra_scraper.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /metrics
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skaiscanner-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: SEARCH_BACKEND
        value: postgres
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: skaiscanner-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: skaiscanner-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: skaiscanner-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://skaiscanner-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://skaiscanner-web.onrender.com
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://.*\.onrender\.com$
      - key: CSRF_TRUSTED_ORIGINS
        value: https://skaiscanner-web.onrender.com
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: skaiscanner-celery
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A yatra_scraper worker -l info --pool=solo
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skaiscanner-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: SEARCH_BACKEND
        value: postgres
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: skaiscanner-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: skaiscanner-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: skaiscanner-redis
          property: connectionString
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: skaiscanner-web
    runtime: static
    rootDir: skyclone
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://skaiscanner-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: skaiscanner-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: skaiscanner-db
    databaseName: skaiscanner
    user: skaiscanner
    plan: free
