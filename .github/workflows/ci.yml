name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yatra_prices
          POSTGRES_USER: yatra
          POSTGRES_PASSWORD: yatra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yatra -d yatra_prices"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: dev-master-key
          MEILI_ENV: development
        ports:
          - 7700:7700
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      POSTGRES_DB: yatra_prices
      POSTGRES_USER: yatra
      POSTGRES_PASSWORD: yatra
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      CACHE_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      SEARCH_BACKEND: postgres
      MEILISEARCH_URL: http://127.0.0.1:7700
      MEILISEARCH_MASTER_KEY: dev-master-key
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      LOG_FORMAT: console
      SENTRY_DSN: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test accounts flights

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyclone
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skyclone/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
